services:
  - type: web
    name: employee-policy-rag-v3
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.v3.ingest_v3
    startCommand: uvicorn src.v3.api_v3:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: V3_MODEL_PROVIDER
        value: gemini
      - key: V3_LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: V3_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: V3_CHROMA_PATH
        value: chroma_db_v3_gemini
      - key: V3_COLLECTION_NAME
        value: employee_policies_v3_gemini
      - key: GEMINI_API_KEY
        sync: false
